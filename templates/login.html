<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Controller | Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #15191e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .login-box {
            background: #21242a;
            padding: 36px 30px 30px 30px;
            border-radius: 14px;
            box-shadow: 0 6px 36px #171c2a80;
            min-width: 320px;
            max-width: 98vw;
        }
        .login-box h2 {
            color: #83bcff;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2em;
            letter-spacing: 0.03em;
        }
        .login-box input,
        .login-box button {
            width: 100%;
            font-size: 1.14em;
            margin-bottom: 18px;
            border-radius: 8px;
            border: none;
            outline: none;
            padding: 13px;
            background: #181b20;
            color: #e6e8ff;
            transition: background 0.16s;
        }
        .login-box input:focus {
            background: #242a34;
        }
        .login-box button {
            background: #3498ff;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.14s;
        }
        .login-box button:hover {
            background: #2371b6;
        }
        .login-box .error {
            color: #ff9e90;
            margin-top: -10px;
            margin-bottom: 6px;
            text-align: center;
            font-size: 1.04em;
        }
        .auth-links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            font-size: 0.98em;
        }
        .auth-links a {
            color: #9fd5ff;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
           /* ────────────────────── NEW SWITCH STYLES ------------------------------------- */
           .switch-wrapper {
            display:flex;
            align-items:center;         /* vertically centre text & switch          */
            margin-bottom:18px;         /* match the spacing of other inputs      */
            font-size:1.14em;           /* same size as other form fields         */
        }
        .switch {
            position:relative;
            display:inline-block;
            width:50px;
            height:24px;
            margin-right:10px;          /* space between switch & label text     */
        }
        .switch input {display:none;}
        .slider{
           position:absolute;
           cursor:pointer;
           background:#ccc;
           border-radius:34px;
           height:100%;
           width:100%;
           transition:.4s;
        }
        .slider::before{
            content:"";
            position:absolute;
            width:18px;height:18px;
            left:3px;top:3px;
            background:white;
            border-radius:50%;
            transition:.4s;
        }
        input:checked + .slider {background:#2196F3;}
        input:checked + .slider::before{
           transform:translateX(26px);
        }

    </style>
</head>
<body>
    <form class="login-box" method="post">

        <h2>LLM Controller Login</h2>

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input name="email"
               placeholder="Email"
               type="email"
               required
               autofocus
               value="{{ request.form.get('email','') }}">
        
        <input name="password"
               type="password"
               placeholder="Password"
               required>

        <div class="switch-wrapper">
            <label class="switch">
                <input type="checkbox" id="remember-me" name="remember"
                       {% if request.form.get('remember') %}checked{% endif %}
                >
                <span class="slider"></span>
            </label>
            Remember me
        </div>

        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <button type="submit">Login</button>
        <div class="auth-links">
            <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
            <a href="{{ url_for('auth.resend_confirmation') }}">Resend confirmation</a>
        </div>
    </form>
</body>
