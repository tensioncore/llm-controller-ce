<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Controller | Forgot Password</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #15191e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 18px;
        }
        .auth-box {
            background: #21242a;
            padding: 34px 30px 30px 30px;
            border-radius: 14px;
            box-shadow: 0 6px 36px #171c2a80;
            min-width: 320px;
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #83bcff;
            text-align: center;
            margin: 0 0 14px 0;
        }
        p {
            color: #ced6e5;
            text-align: center;
            line-height: 1.45;
        }
        input,
        button {
            width: 100%;
            font-size: 1.08em;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            padding: 13px;
            background: #181b20;
            color: #e6e8ff;
            box-sizing: border-box;
        }
        button {
            background: #3498ff;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .message {
            color: #87e3a0;
            margin-top: 14px;
            text-align: center;
        }
        .auth-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #9fd5ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Forgot Password</h2>
        <p>Enter your account email. If it can receive a reset link, one will be sent.</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input name="email" type="email" required autofocus autocomplete="email" placeholder="Email" value="{{ request.form.get('email','') }}">
            <button type="submit">Send Reset Link</button>
        </form>
        {% if message %}<div class="message">{{ message }}</div>{% endif %}
        <a class="auth-link" href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
</body>
</html>
